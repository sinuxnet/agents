<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SINUXNET — Sina · UX · Network">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- terminal / unix rail -->
  <rect x="52" y="108" width="16" height="296" rx="8" fill="#22D3EE"/>

  <!--
    Etymology as color:
    SIN  — from Sina (identity)     → white
    UX   — user experience          → cyan
    NET  — network                  → steel
    Compound like Stuxnet; craft like Linus+Unix→Linux
  -->
  <g transform="translate(92 168)">
    <!-- SIN -->
    <g fill="#F8FAFC">
      <!-- S -->
      <path d="M0 0h44v18H18v10h26v44H0V54h26V44H0V0z"/>
      <!-- I -->
      <rect x="56" y="0" width="18" height="72"/>
      <!-- N -->
      <path d="M88 0h18l28 44V0h18v72h-18L106 28v44H88V0z"/>
    </g>

    <!-- UX (emphasis) -->
    <g fill="#22D3EE" transform="translate(168 0)">
      <!-- U -->
      <path d="M0 0h18v42c0 7 5 14 14 14s14-7 14-14V0h18v42c0 20-15 34-32 34S0 62 0 42V0z"/>
      <!-- X -->
      <path d="M72 0h22l16 22 16-22h22L124 36l24 36h-22L110 50 94 72H72l24-36L72 0z"/>
    </g>
  </g>

  <!-- NET -->
  <g fill="#94A3B8" transform="translate(92 292)">
    <!-- N -->
    <path d="M0 0h18l28 44V0h18v72H46L18 28v44H0V0z"/>
    <!-- E -->
    <path d="M80 0h58v18H98v10h32v18H98v10h42v18H80V0z"/>
    <!-- T -->
    <path d="M154 0h68v18h-25v54h-18V18h-25V0z"/>
  </g>

  <!-- network: three linked nodes (net) -->
  <g fill="none" stroke="#22D3EE" stroke-width="3" stroke-linecap="round">
    <circle cx="380" cy="400" r="7" fill="#22D3EE" stroke="none"/>
    <circle cx="420" cy="372" r="7" fill="#38BDF8" stroke="none"/>
    <circle cx="448" cy="416" r="7" fill="#67E8F9" stroke="none"/>
    <path d="M386 396l28-18M426 378l16 30"/>
  </g>

  <!-- micro legend (readable at large size; collapses as texture at favicon) -->
  <text x="92" y="420"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="0.28em" fill="#475569">SINA · UX · NET</text>
</svg>
